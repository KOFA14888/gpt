name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -ne 0) {
            $log = Get-Content build_log.txt -Raw
            Write-Host "::error::Windows build failed"
            # dump errors to job summary
            $errors = (Get-Content build_log.txt | Select-String -Pattern "error|Error C|LNK" | Select-Object -First 80) -join "`n"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows build errors`n``````n$errors`n``````"
            # also print to console for annotations
            Write-Host $errors
            exit 1
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenmate-windows
          path: build/Release/screenmate.exe
          if-no-files-found: error

      - name: Package release zip
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: Compress-Archive -Path build/Release/screenmate.exe -DestinationPath screenmate-windows.zip

      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: screenmate-windows.zip
          tag_name: latest-${{ github.sha }}
          name: ScreenMate ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Help smoke test
        run: ./build/screenmate help
