name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content build_log.txt
            $count = 0
            foreach ($l in $lines) {
              if ($l -match 'error\s+[A-Z]?\d+|error C\d+|LNK\d+|fatal error') {
                Write-Host "::error::$l"
                $count++
                if ($count -ge 50) { break }
              }
            }
            if ($count -eq 0) {
              $tail = $lines | Select-Object -Last 40
              foreach ($l in $tail) { Write-Host "::error::$l" }
            }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/Release/screenmate.exe -DestinationPath screenmate-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenmate-windows
          path: screenmate-windows.zip
          if-no-files-found: error

  linux:
    # Pinned: ubuntu-latest floated to 26.04 (2026-10-30), whose GCC defaults
    # to -march=x86-64-v3 (AVX2) and crashes old CPUs with
    # "CPU ISA level is lower than required". CMake also forces -march=x86-64;
    # the pin keeps glibc/libstdc++ we link against baseline as well.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: ISA baseline check
        # Baseline x86-64 (SSE2) never emits VEX-encoded (v-prefixed)
        # instructions; any such mnemonic means AVX crept in.
        run: |
          bad=$(objdump -d build/screenmate | grep -Eo '\bv[a-z0-9]+\b' | sort -u || true)
          if [ -n "$bad" ]; then
            echo "ERROR: not baseline x86-64, found:"; echo "$bad"
            exit 1
          fi
          echo "OK: baseline x86-64 (no AVX)"

      - name: Help smoke test
        run: ./build/screenmate help

      - name: Package
        run: tar czf screenmate-linux-x64.tar.gz -C build screenmate

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenmate-linux
          path: screenmate-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: screenmate-*
          merge-multiple: true

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la
          gh release view latest --repo "$GITHUB_REPOSITORY" 2>/dev/null | Out-Null || true
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest screenmate-windows.zip screenmate-linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ScreenMate latest" \
            --notes "Auto-built from \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`.

          - \`screenmate-windows.zip\` → \`screenmate.exe\` (Windows x64)
          - \`screenmate-linux-x64.tar.gz\` → \`screenmate\` (Linux x64)

          Install: Windows \`install.ps1\` · Linux/macOS \`install.sh\`" \
            --latest
