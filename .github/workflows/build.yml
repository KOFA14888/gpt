name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content build_log.txt
            # Emit each compiler error as a GitHub annotation (visible via API)
            $count = 0
            foreach ($l in $lines) {
              if ($l -match 'error\s+[A-Z]?\d+|error C\d+|LNK\d+|fatal error') {
                Write-Host "::error::$l"
                $count++
                if ($count -ge 50) { break }
              }
            }
            if ($count -eq 0) {
              # dump last 40 lines as annotations so we can see what happened
              $tail = $lines | Select-Object -Last 40
              foreach ($l in $tail) {
                Write-Host "::error::$l"
              }
            }
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenmate-windows
          path: build/Release/screenmate.exe
          if-no-files-found: error

      - name: Package release zip
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path build/Release/screenmate.exe -DestinationPath screenmate-windows.zip -Force

      - name: Release (latest)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release delete latest --yes --cleanup-tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          gh release create latest screenmate-windows.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "ScreenMate latest" `
            --notes "Auto-built from ``$($env:GITHUB_SHA)`` on ``$($env:GITHUB_REF_NAME)``. Contains ``screenmate.exe`` (Windows x64, Release)." `
            --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Help smoke test
        run: ./build/screenmate help
